<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>503 — Service Unavailable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    background: #000;
    color: #e5e5e5;
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 28px;
    border-bottom: 1px solid #111;
  }

  .logo img {
    height: 32px;
    width: auto;
    display: block;
  }

  .status-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #555;
    border: 1px solid #1a1a1a;
    padding: 5px 10px;
    border-radius: 4px;
  }

  /* Main */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px 60px;
    gap: 28px;
  }

  .gif-wrap {
    width: min(300px, 55vw);
  }

  .gif-wrap img {
    width: 100%;
    height: auto;
    display: block;
    opacity: 0.9;
  }

  .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(56px, 10vw, 96px);
    font-weight: 400;
    line-height: 1;
    letter-spacing: -0.04em;
    color: #fff;
  }

  .headline {
    font-size: 17px;
    font-weight: 500;
    color: #fff;
    letter-spacing: -0.2px;
  }

  .subtext {
    font-size: 14px;
    color: #555;
    max-width: 440px;
    line-height: 1.6;
  }

  .subtext span {
    color: #888;
  }

  .retry {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #444;
  }

  .retry-dot {
    width: 5px;
    height: 5px;
    background: #444;
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .retry-dot { animation: none; opacity: 0.5; }
  }

  /* Footer — centered */
  footer {
    border-top: 1px solid #111;
    padding: 32px 24px 40px;
  }

  .footer-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .contact-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    transition: opacity 0.15s;
  }

  .contact-item:hover {
    opacity: 0.7;
  }

  .contact-item .icon-circle {
    width: 44px;
    height: 44px;
    border: 1px solid #222;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s;
  }

  .contact-item:hover .icon-circle {
    border-color: #444;
  }

  .contact-item .icon-circle svg {
    width: 18px;
    height: 18px;
    opacity: 0.6;
  }

  .contact-item:hover .icon-circle svg {
    opacity: 0.9;
  }

  .contact-item .label {
    font-size: 12px;
    color: #444;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Mobile */
  @media (max-width: 520px) {
    header { padding: 16px 20px; }
    .logo img { height: 26px; }
    .status-pill { display: none; }
    main { padding: 32px 20px 48px; gap: 22px; }
    .gif-wrap { width: min(260px, 65vw); }
  }
</style>
<base target="_blank">
</head>
<body>

<header>
  <a href="/" class="logo">
    <img src="assets/logo.png" alt="Libra">
  </a>
  <div class="status-pill">503</div>
</header>

<main>
  <div class="gif-wrap">
    <img src="assets/cracked-satellite-dish-no-connection-or-network-failure-problem.gif" alt="No connection">
  </div>

  <div class="code">503</div>

  <div class="headline">Service temporarily unavailable</div>

  <p class="subtext">
    We're experiencing higher than usual demand.<br>
    Hang tight — <span>we'll be back shortly</span>.
  </p>

  <div class="retry">
    <div class="retry-dot"></div>
    <span>Retrying automatically</span>
  </div>
</main>

<footer>
  <div class="footer-inner">
    <div class="contact-row">
      <a href="mailto:sorhxrisa1512@duck.com" class="contact-item">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <span class="label">Mail</span>
      </a>

      <a href="https://github.com/hxrisa-sor/" target="_blank" rel="noopener" class="contact-item">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
        </div>
        <span class="label">GitHub</span>
      </a>
    </div>
  </div>
</footer>

</body>
</html>
